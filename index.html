<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>間歇計時器</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%232ecc71'/%3E%3Ccircle cx='160' cy='54' r='24' fill='%23fff'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M140 98 116 152'/%3E%3Cpath d='M138 104 176 126 204 104'/%3E%3Cpath d='M138 104 100 112 78 140'/%3E%3Cpath d='M116 152 162 178 150 226'/%3E%3Cpath d='M116 152 88 190 46 196'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%232ecc71'/%3E%3Ccircle cx='160' cy='54' r='24' fill='%23fff'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M140 98 116 152'/%3E%3Cpath d='M138 104 176 126 204 104'/%3E%3Cpath d='M138 104 100 112 78 140'/%3E%3Cpath d='M116 152 162 178 150 226'/%3E%3Cpath d='M116 152 88 190 46 196'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#111418; --panel:#1b2026; --text:#f3f5f7; --muted:#8a96a3;
    --work:#2ecc71; --rest:#3498db; --long:#9b59b6; --done:#f1c40f; --ready:#e67e22;
    --phase:var(--ready);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px; min-height:100%;
    transition:background .4s;
  }
  body.phase-work{--phase:var(--work)}
  body.phase-rest{--phase:var(--rest)}
  body.phase-long{--phase:var(--long)}
  body.phase-done{--phase:var(--done)}
  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:16px}
  .top{display:flex; justify-content:space-between; gap:8px}
  .chip{flex:1; background:var(--panel); border-radius:14px; padding:10px 12px; text-align:center}
  .chip .k{font-size:12px; color:var(--muted)}
  .chip .v{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
  .ringbox{position:relative; width:100%; aspect-ratio:1/1; max-width:360px; margin:0 auto}
  svg{width:100%; height:100%; transform:rotate(-90deg)}
  .track{stroke:#2a3038}
  .prog{stroke:var(--phase); stroke-linecap:round; transition:stroke .4s}
  .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .phase{font-size:28px; font-weight:800; color:var(--phase); letter-spacing:2px}
  .time{font-size:min(26vw,104px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05}
  .next{font-size:14px; color:var(--muted)}
  .bar{position:relative; height:14px; background:#2a3038; border-radius:7px; cursor:pointer; touch-action:none}
  .bar>#totalBar{height:100%; width:0; background:var(--phase); border-radius:7px; transition:background .4s}
  .bar .tk{position:absolute; top:0; bottom:0; width:1px; background:#111418; opacity:.6; pointer-events:none}
  .bar .tk.round{width:2px; opacity:1; background:#d0d6dc}
  .bar #thumb{position:absolute; top:50%; width:22px; height:22px; margin-left:-11px; margin-top:-11px; border-radius:50%; background:#fff; box-shadow:0 1px 4px #0008; pointer-events:none}
  .sec{margin-top:14px; padding-top:12px; border-top:1px solid #333b44}
  .sec:first-of-type{border-top:0; padding-top:0}
  .sh{font-size:12px; color:var(--muted); letter-spacing:1px; margin-bottom:8px}
  .rows{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .row{display:flex; flex-direction:column; gap:4px; background:#111418; border-radius:12px; padding:8px 10px}
  .row>span{font-size:13px; color:var(--muted)}
  .step{display:flex; align-items:center; justify-content:space-between}
  .step button{width:36px; height:36px; flex:none; font-size:20px; background:#2a3038; user-select:none}
  .step input{width:100%; min-width:0; border:0; background:transparent; color:var(--text); font-size:20px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; -moz-appearance:textfield}
  .step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
  .step input:focus{outline:none; color:var(--phase)}
  .tgls{display:flex; flex-wrap:wrap; gap:8px}
  .tg input{display:none}
  .tg span{display:inline-block; padding:8px 14px; border-radius:999px; background:#111418; color:var(--muted); font-size:14px; cursor:pointer; border:1px solid #333b44; user-select:none}
  .tg input:checked+span{background:var(--phase); color:#111; border-color:transparent; font-weight:700}
  .vrow2{display:flex; gap:8px; margin-top:10px}
  .vrow2 select{flex:1; min-width:0; padding:8px 10px; border-radius:10px; border:1px solid #333b44; background:#111418; color:var(--text); font-size:14px}
  .vrow2 button{width:40px; height:40px; flex:none; background:#2a3038}
  .chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
  .chips button{flex:1; padding:8px 0; min-width:52px; font-size:14px; background:#111418; border:1px solid #333b44; color:var(--muted)}
  .chips button.sel{background:var(--phase); color:#111; border-color:transparent; font-weight:700}
  .vempty{font-size:13px; color:var(--muted); margin-top:8px}
  .sub2{margin-top:14px; padding:12px 0 0; background:transparent; border-radius:0; border-top:1px solid #333b44}
  .sub2 summary{font-size:13px}
  .list input{width:64px; padding:2px 6px; border-radius:6px; border:1px solid #333b44; background:#111418; color:inherit; font-size:14px; text-align:right}
  .list div{align-items:center; cursor:pointer}
  .totals{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .ctrl{display:flex; gap:12px; justify-content:center; align-items:center}
  button{
    border:0; border-radius:999px; background:var(--panel); color:var(--text);
    font-size:16px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:scale(.96)}
  .small{width:56px; height:56px; font-size:20px}
  .main{width:96px; height:96px; font-size:22px; font-weight:800; background:var(--phase); color:#111; transition:background .4s}
  details{background:var(--panel); border-radius:14px; padding:10px 14px}
  summary{cursor:pointer; color:var(--muted)}
  .sum{display:flex; justify-content:space-between; gap:8px}
  .sum b{color:var(--text); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums}
  #cfgBody{margin-top:12px}
  .list{margin-top:10px; max-height:220px; overflow:auto; font-size:13px; font-variant-numeric:tabular-nums}
  .list div{display:flex; justify-content:space-between; padding:3px 6px; border-radius:6px}
  .list div.cur{background:#2a3038; color:var(--phase); font-weight:700}
  .list div.past{color:#56606b}
</style>
</head>
<body class="phase-ready">
<div class="wrap">
  <div class="top">
    <div class="chip"><div class="k">輪</div><div class="v" id="round">0/3</div></div>
    <div class="chip"><div class="k">組</div><div class="v" id="set">0/4</div></div>
    <div class="chip"><div class="k">總剩餘</div><div class="v" id="totalLeft">0:00</div></div>
  </div>

  <div class="ringbox">
    <svg viewBox="0 0 200 200">
      <circle class="track" cx="100" cy="100" r="90" fill="none" stroke-width="12"/>
      <circle class="prog" id="prog" cx="100" cy="100" r="90" fill="none" stroke-width="12"/>
    </svg>
    <div class="center">
      <div class="phase" id="phase">準備</div>
      <div class="time" id="time">0:00</div>
      <div class="next" id="next"></div>
    </div>
  </div>

  <div class="bar" id="bar" title="點擊或拖曳以跳到指定時間"><div id="totalBar"></div><div id="ticks"></div><div id="thumb"></div></div>
  <div class="totals"><span id="elapsed">已進行 0:00</span><span id="total">總長 0:00</span></div>

  <div class="ctrl">
    <button class="small" id="prev" title="上一段">⏮</button>
    <button class="small" id="reset" title="重置">↺</button>
    <button class="main" id="play">開始</button>
    <button class="small" id="skip" title="下一段">⏭</button>
  </div>

  <details>
    <summary class="sum"><span>⚙ 設定</span><b id="cfgSum"></b></summary>
    <div id="cfgBody">
      <div class="sec">
        <div class="sh">時間（秒）</div>
        <div class="rows">
          <div class="row"><span>運動</span><div class="step"><button data-d="-5">−</button><input type="number" inputmode="numeric" id="cWork" min="1" value="30"><button data-d="5">＋</button></div></div>
          <div class="row"><span>組間休息</span><div class="step"><button data-d="-5">−</button><input type="number" inputmode="numeric" id="cRest" min="0" value="15"><button data-d="5">＋</button></div></div>
          <div class="row"><span>每輪最後休息</span><div class="step"><button data-d="-5">−</button><input type="number" inputmode="numeric" id="cLong" min="0" value="30"><button data-d="5">＋</button></div></div>
          <div class="row"><span>準備倒數</span><div class="step"><button data-d="-1">−</button><input type="number" inputmode="numeric" id="cPrep" min="0" value="5"><button data-d="1">＋</button></div></div>
        </div>
      </div>
      <div class="sec">
        <div class="sh">次數</div>
        <div class="rows">
          <div class="row"><span>每輪組數</span><div class="step"><button data-d="-1">−</button><input type="number" inputmode="numeric" id="cSets" min="1" value="4"><button data-d="1">＋</button></div></div>
          <div class="row"><span>輪數</span><div class="step"><button data-d="-1">−</button><input type="number" inputmode="numeric" id="cRounds" min="1" value="3"><button data-d="1">＋</button></div></div>
        </div>
        <div class="tgls" style="margin-top:8px">
          <label class="tg"><input type="checkbox" id="cSkipLast" checked><span>最後一輪不做最後休息</span></label>
        </div>
      </div>
      <div class="sec">
        <div class="sh">聲音</div>
        <div class="tgls">
          <label class="tg"><input type="checkbox" id="cSound" checked><span>提示音</span></label>
          <label class="tg"><input type="checkbox" id="cTick" checked><span>滴答聲</span></label>
          <label class="tg"><input type="checkbox" id="cVoice" checked><span>語音</span></label>
        </div>
        <div id="voiceBox">
          <div class="vrow2"><select id="voiceSel"></select><button id="vTest" title="試聽">▶</button></div>
          <div class="chips" id="presetList"></div>
        </div>
      </div>
      <details class="sub2">
        <summary>時間軸（可個別修改每段秒數、點選跳轉）</summary>
        <div class="list" id="list"></div>
      </details>
    </div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const R = 90, C = 2 * Math.PI * R;
$('prog').style.strokeDasharray = C;

let segs = [], idx = 0, remainMs = 0, running = false, lastTs = 0, timer = null, lastBeepSec = null, wakeLock = null;

const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const num = (id, d) => { const v = parseInt($(id).value, 10); return isNaN(v) ? d : v; };

function build() {
  const prep = num('cPrep', 5), work = num('cWork', 30), rest = num('cRest', 15),
        long = num('cLong', 30), sets = num('cSets', 4), rounds = num('cRounds', 3);
  segs = [];
  if (prep > 0) segs.push({ type: 'ready', name: '準備', dur: prep, r: 0, s: 0 });
  for (let r = 1; r <= rounds; r++) {
    for (let s = 1; s <= sets; s++) {
      segs.push({ type: 'work', name: '運動', dur: work, r, s });
      const isLastOfRound = s === sets;
      const d = isLastOfRound ? long : rest;
      if (isLastOfRound && r === rounds && $('cSkipLast').checked) continue;
      if (d > 0) segs.push({ type: isLastOfRound ? 'long' : 'rest', name: isLastOfRound ? '長休息' : '休息', dur: d, r, s });
    }
  }
  segs.push({ type: 'done', name: '完成', dur: 0, r: rounds, s: sets });
  idx = 0; remainMs = segs[0].dur * 1000; lastBeepSec = null;
  $('cfgSum').textContent = `${work}s／${rest}s × ${sets}組 × ${rounds}輪`;
  renderList(); render();
}

function totalSec() { return segs.reduce((a, b) => a + b.dur, 0); }
function elapsedSec() {
  let e = 0; for (let i = 0; i < idx; i++) e += segs[i].dur;
  return e + (segs[idx].dur - remainMs / 1000);
}

function renderList() {
  $('list').innerHTML = segs.map((x, i) => {
    if (x.type === 'done') return '';
    const label = x.type === 'ready' ? '準備' : `第${x.r}輪 第${x.s}組 ${x.name}`;
    return `<div data-i="${i}"><span>${label}</span><span><input type="number" min="1" value="${x.dur}" data-i="${i}"> s</span></div>`;
  }).join('');
  renderTicks();
}

// 進度條上的分段刻度（每輪開頭為粗線）
function renderTicks() {
  const tot = totalSec(); let cum = 0, html = '';
  segs.forEach((x, i) => {
    if (i > 0 && x.type !== 'done' && tot) {
      const isRound = x.type === 'work' && x.s === 1;
      html += `<div class="tk${isRound ? ' round' : ''}" style="left:${cum / tot * 100}%"></div>`;
    }
    cum += x.dur;
  });
  $('ticks').innerHTML = html;
}

// 跳到總時間 t 秒的位置
function seekTo(t) {
  const tot = totalSec();
  t = Math.max(0, Math.min(t, tot));
  let cum = 0, i = 0;
  while (i < segs.length - 1 && cum + segs[i].dur <= t) { cum += segs[i].dur; i++; }
  idx = i;
  remainMs = (segs[i].dur - (t - cum)) * 1000;
  lastBeepSec = Math.ceil(remainMs / 1000);   // 跳轉當下不補播聲音
  lastTs = performance.now();
  if (segs[idx].type === 'done' && running) stop();
  render();
}

function render() {
  const seg = segs[idx];
  document.body.className = 'phase-' + seg.type;
  $('phase').textContent = seg.name;
  $('time').textContent = seg.type === 'done' ? '🎉' : fmt(remainMs / 1000);
  const frac = seg.dur ? 1 - remainMs / (seg.dur * 1000) : 1;
  $('prog').style.strokeDashoffset = C * frac;
  const nx = segs[idx + 1];
  $('next').textContent = nx ? (nx.type === 'done' ? '下一段：完成' : `下一段：${nx.name} ${nx.dur}s`) : '';
  $('round').textContent = `${seg.r}/${num('cRounds', 3)}`;
  $('set').textContent = `${seg.s}/${num('cSets', 4)}`;
  const tot = totalSec(), el = elapsedSec();
  $('totalLeft').textContent = fmt(tot - el);
  $('elapsed').textContent = '已進行 ' + fmt(el);
  $('total').textContent = '總長 ' + fmt(tot);
  $('totalBar').style.width = (tot ? el / tot * 100 : 0) + '%';
  $('thumb').style.left = (tot ? el / tot * 100 : 0) + '%';
  $('play').textContent = seg.type === 'done' ? '重來' : running ? '暫停' : (el > 0 ? '繼續' : '開始');
  document.querySelectorAll('#list div').forEach(d => {
    const i = +d.dataset.i;
    d.className = i === idx ? 'cur' : i < idx ? 'past' : '';
  });
  const cur = document.querySelector('#list .cur');
  if (cur && $('list').closest('details').open) cur.scrollIntoView({ block: 'nearest' });
  document.title = seg.type === 'done' ? '完成 - 間歇計時器' : `${fmt(remainMs / 1000)} ${seg.name}`;
}

// ---- 聲音 ----
let ac = null;
// 較自然的提示音：快速起音 + 指數衰減，主音加一點高八度泛音
function beep(freq = 1760, ms = 100, vol = 0.35) {
  if (!$('cSound').checked) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime, end = t0 + ms / 1000;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    g.connect(ac.destination);
    [[freq, 1], [freq * 2, 0.25]].forEach(([f, a]) => {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'sine'; o.frequency.value = f; og.gain.value = a;
      o.connect(og).connect(g); o.start(t0); o.stop(end + 0.02);
    });
  } catch (e) {}
}

// ---- 語音：可試聽、可選擇，選擇存在瀏覽器 ----
const PRESETS = [
  { n: '標準', d: '原速、原音調', r: 1.0, p: 1.0 },
  { n: '俐落', d: '稍快、原音調', r: 1.2, p: 1.0 },
  { n: '明快', d: '快、稍高', r: 1.3, p: 1.15 },
  { n: '教練', d: '快、低沉有力', r: 1.25, p: 0.8 },
  { n: '活力', d: '很快、高音', r: 1.45, p: 1.3 },
];
let vcfg = { voice: '', preset: 1 };
try { Object.assign(vcfg, JSON.parse(localStorage.getItem('timerVoice') || '{}')); } catch (e) {}
const saveV = () => { try { localStorage.setItem('timerVoice', JSON.stringify(vcfg)); } catch (e) {} };

let voices = [], voice = null;
const vScore = v => (/natural/i.test(v.name) ? 8 : 0) + (/online/i.test(v.name) ? 4 : 0) +
                    (/google/i.test(v.name) ? 3 : 0) + (/TW|Hant/i.test(v.lang) ? 2 : 0);
function loadVoices() {
  if (!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter(v => /^zh|cmn|yue/i.test(v.lang)).sort((a, b) => vScore(b) - vScore(a));
  voice = voices.find(v => v.name === vcfg.voice) || voices[0] || null;
  renderVoices();
}
function speak(t, v, pr, queue = false) {
  if (!window.speechSynthesis) return;
  if (!queue) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = v ? v.lang : 'zh-TW'; if (v) u.voice = v;
  u.rate = pr.r; u.pitch = pr.p; u.volume = 1;
  speechSynthesis.speak(u);
}
function preview(v, pr) { speak('開始', v, pr); setTimeout(() => speak('休息', v, pr, true), 50); }
function say(t) {
  if (!$('cVoice').checked) return;
  speak(t, voice, PRESETS[vcfg.preset] || PRESETS[0]);
}
function langName(l) {
  return /TW|Hant/i.test(l) ? '台灣' : /HK|yue/i.test(l) ? '香港／粵語' : /CN|Hans/i.test(l) ? '中國' : l;
}
const curPreset = () => PRESETS[vcfg.preset] || PRESETS[0];
function renderVoices() {
  const sel = $('voiceSel');
  const old = document.querySelector('#voiceBox .vempty'); if (old) old.remove();
  if (!voices.length) {
    sel.innerHTML = '<option>（無中文語音）</option>'; sel.disabled = true;
    $('voiceBox').insertAdjacentHTML('beforeend', '<div class="vempty">找不到中文語音。建議改用 Edge 開啟，或在 Windows「設定 → 時間與語言 → 語音」加裝中文語音。</div>');
  } else {
    sel.disabled = false;
    sel.innerHTML = voices.map((v, i) =>
      `<option value="${i}"${v === voice ? ' selected' : ''}>${v.name.replace(/^Microsoft\s+/i, '').replace(/\s*-\s*Chinese.*$/i, '')}（${langName(v.lang)}${/natural|online/i.test(v.name) ? '・自然' : ''}）</option>`).join('');
  }
  $('presetList').innerHTML = PRESETS.map((p, i) =>
    `<button class="${i === +vcfg.preset ? 'sel' : ''}" data-p="${i}" title="${p.d}">${p.n}</button>`).join('');
}
$('voiceSel').addEventListener('change', e => {
  voice = voices[+e.target.value]; vcfg.voice = voice.name; saveV(); preview(voice, curPreset());
});
$('vTest').onclick = () => preview(voice, curPreset());
$('presetList').addEventListener('click', e => {
  const r = e.target.closest('[data-p]');
  if (r) { vcfg.preset = +r.dataset.p; saveV(); renderVoices(); preview(voice, curPreset()); }
});
$('cVoice').addEventListener('change', () => { $('voiceBox').style.display = $('cVoice').checked ? '' : 'none'; });
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
else renderVoices();

function announceSeg(seg) {
  if (seg.type === 'work') say('開始');
  else if (seg.type === 'rest' || seg.type === 'long') say('休息');
}
function tickSound() {
  if (!$('cTick').checked) return;
  beep(2637, 25, 0.12);
}

function enterSeg(i, announce = true) {
  idx = Math.max(0, Math.min(i, segs.length - 1));
  remainMs = segs[idx].dur * 1000; lastBeepSec = null;
  const seg = segs[idx];
  if (announce) {
    if (seg.type === 'done') { beep(1568, 160); setTimeout(() => beep(2093, 160), 170); setTimeout(() => beep(2637, 400), 340); say('全部完成'); stop(); }
    else { beep(seg.type === 'work' ? 2093 : 1568, 220); announceSeg(seg); }
  }
}

function tick() {
  const now = performance.now(), dt = now - lastTs; lastTs = now;
  remainMs -= dt;
  while (remainMs <= 0 && segs[idx].type !== 'done') {
    const over = -remainMs;
    enterSeg(idx + 1);
    if (segs[idx].type === 'done') break;
    remainMs -= over;
  }
  const sec = Math.ceil(remainMs / 1000);
  if (running && sec >= 1 && sec !== lastBeepSec && sec < segs[idx].dur) {
    lastBeepSec = sec;
    if (sec <= 3) beep(1760, 90);   // 最後 3 秒：提示音
    else tickSound();               // 其餘每秒：滴答聲
  }
  render();
}

async function start() {
  if (segs[idx].type === 'done') { build(); }
  running = true; lastTs = performance.now();
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  if (elapsedSec() === 0) { const s = segs[0]; beep(s.type === 'work' ? 2093 : 1568, 220); announceSeg(s); }
  timer = setInterval(tick, 100);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  render();
}
function stop() {
  running = false; clearInterval(timer); timer = null;
  try { wakeLock?.release(); } catch (e) {} wakeLock = null;
  render();
}

$('play').onclick = () => running ? stop() : start();
$('reset').onclick = () => { stop(); build(); };
$('skip').onclick = () => { enterSeg(idx + 1, running); lastTs = performance.now(); render(); };
$('prev').onclick = () => {
  const target = (segs[idx].dur * 1000 - remainMs > 2000) ? idx : idx - 1;
  enterSeg(target, false); lastTs = performance.now(); render();
};
$('list').onclick = e => {
  if (e.target.tagName === 'INPUT') return;
  const d = e.target.closest('div[data-i]'); if (d) { enterSeg(+d.dataset.i, false); lastTs = performance.now(); render(); }
};
// 個別修改某一段秒數
$('list').addEventListener('change', e => {
  if (e.target.tagName !== 'INPUT') return;
  const i = +e.target.dataset.i, v = Math.max(1, parseInt(e.target.value, 10) || 1);
  e.target.value = v;
  const s = segs[i], used = s.dur * 1000 - remainMs;
  s.dur = v;
  if (i === idx) remainMs = Math.max(0, v * 1000 - used);
  renderTicks(); render();
});
// 拖曳／點擊進度條跳轉
(() => {
  const bar = $('bar'); let drag = false;
  const pos = e => { const r = bar.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * totalSec()); };
  bar.addEventListener('pointerdown', e => { drag = true; bar.setPointerCapture(e.pointerId); pos(e); });
  bar.addEventListener('pointermove', e => { if (drag) pos(e); });
  bar.addEventListener('pointerup', () => { drag = false; });
  bar.addEventListener('pointercancel', () => { drag = false; });
})();
document.querySelectorAll('.step input, #cSkipLast').forEach(el => el.addEventListener('change', () => {
  if (el.type === 'number') el.value = Math.max(+el.min, parseInt(el.value, 10) || +el.min);
  stop(); build();
}));
// －／＋ 按鈕：點一下調整，按住連續調整
document.querySelectorAll('.step button').forEach(b => {
  const inp = b.parentElement.querySelector('input'), d = +b.dataset.d;
  let t1 = null, t2 = null;
  const bump = () => { inp.value = Math.max(+inp.min, (parseInt(inp.value, 10) || 0) + d); inp.dispatchEvent(new Event('change')); };
  const end = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  b.addEventListener('pointerdown', e => { e.preventDefault(); bump(); t1 = setTimeout(() => { t2 = setInterval(bump, 90); }, 400); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, end));
});
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); $('play').click(); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
});

build();
</script>
</body>
</html>
